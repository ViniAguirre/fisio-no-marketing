server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip para performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Fontes: nunca mudam de nome
    location ~* \.woff2$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imagens e scripts da animação: cache de 7 dias (nomes fixos, podem ser atualizados)
    location ~* \.(js|css|png|jpg|jpeg|webp|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA: todas as rotas servem index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
